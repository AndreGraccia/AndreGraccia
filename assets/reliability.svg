<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="290" viewBox="0 0 1600 290" role="img" aria-labelledby="title desc">
<title id="title">Princípios de engenharia</title><desc id="desc">Quatro pilares de trabalho em software: arquitetura clara, testes, integração confiável e evolução sustentável.</desc>
<defs>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#15182A" stop-opacity=".94"/><stop offset="1" stop-color="#0B0C17" stop-opacity=".96"/></linearGradient>
 <linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8CA7FF" stop-opacity=".54"/><stop offset=".55" stop-color="#906CFF" stop-opacity=".2"/><stop offset="1" stop-color="#71D7FF" stop-opacity=".34"/></linearGradient>
</defs>
<text x="10" y="34" fill="#A7A8C5" font-family="JetBrains Mono,SFMono-Regular,Consolas,monospace" font-size="14" letter-spacing="2">ENGINEERING VALUES / 04 PILLARS</text>
<text x="10" y="82" fill="#FFFFFF" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="34" font-weight="700" letter-spacing="-1">Software confiável é resultado de boas decisões.</text>
<g transform="translate(0 112)">
 <g><rect width="376" height="158" rx="18" fill="url(#glass)" stroke="url(#border)"/><circle cx="34" cy="38" r="16" fill="#7B83FF" fill-opacity=".2" stroke="#AAB8FF" stroke-opacity=".5"/><text x="34" y="44" fill="#D8DCFF" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="13">01</text><text x="26" y="91" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="650">Design</text><text x="26" y="122" fill="#B4B6D0" font-family="Inter,Arial,sans-serif" font-size="15">Responsabilidades claras</text></g>
 <g transform="translate(408)"><rect width="376" height="158" rx="18" fill="url(#glass)" stroke="url(#border)"/><circle cx="34" cy="38" r="16" fill="#7B83FF" fill-opacity=".2" stroke="#AAB8FF" stroke-opacity=".5"/><text x="34" y="44" fill="#D8DCFF" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="13">02</text><text x="26" y="91" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="650">Testes</text><text x="26" y="122" fill="#B4B6D0" font-family="Inter,Arial,sans-serif" font-size="15">Comportamento verificável</text></g>
 <g transform="translate(816)"><rect width="376" height="158" rx="18" fill="url(#glass)" stroke="url(#border)"/><circle cx="34" cy="38" r="16" fill="#7B83FF" fill-opacity=".2" stroke="#AAB8FF" stroke-opacity=".5"/><text x="34" y="44" fill="#D8DCFF" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="13">03</text><text x="26" y="91" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="650">Integração</text><text x="26" y="122" fill="#B4B6D0" font-family="Inter,Arial,sans-serif" font-size="15">Contratos e consistência</text></g>
 <g transform="translate(1224)"><rect width="376" height="158" rx="18" fill="url(#glass)" stroke="url(#border)"/><circle cx="34" cy="38" r="16" fill="#7B83FF" fill-opacity=".2" stroke="#AAB8FF" stroke-opacity=".5"/><text x="34" y="44" fill="#D8DCFF" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="13">04</text><text x="26" y="91" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="650">Evolução</text><text x="26" y="122" fill="#B4B6D0" font-family="Inter,Arial,sans-serif" font-size="15">Manutenção e documentação</text></g>
</g></svg>