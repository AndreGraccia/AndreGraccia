<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-labelledby="t d">
<title id="t">Atividade no GitHub</title><desc id="d">Estrelas, commits, pull requests, issues e repositórios, atualizados automaticamente.</desc>
<style>
text{font-family:Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif}
.m{font-family:'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;letter-spacing:.14em}
@keyframes d1{to{transform:translate(40px,22px)}}
@keyframes d2{to{transform:translate(-36px,-18px)}}
@keyframes fl{50%{transform:translateY(-6px)}}
.b1{animation:d1 14s ease-in-out infinite alternate}
.b2{animation:d2 17s ease-in-out infinite alternate}
.fl{animation:fl 6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.b1,.b2,.fl{animation:none}}
</style><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070914"/><stop offset="1" stop-color="#0D1124"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".16"/><stop offset=".5" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#4F6BFF" stop-opacity=".12"/></linearGradient>
<linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".55"/><stop offset=".4" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity=".18"/></linearGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#78CFFF"/><stop offset=".6" stop-color="#9C8BFF"/><stop offset="1" stop-color="#E8A6FF"/></linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity=".5"/></filter>
</defs>
<clipPath id="c"><rect width="1200" height="200" rx="28"/></clipPath>
<g clip-path="url(#c)"><rect width="1200" height="200" fill="url(#bg)"/>
<circle class="b1" cx="140" cy="200" r="130" fill="#4F6BFF" opacity=".32" filter="url(#blur)"/>
<circle class="b2" cx="1060" cy="0" r="140" fill="#9C8BFF" opacity=".3" filter="url(#blur)"/>
<g filter="url(#sh)"><rect x="24" y="24" width="216" height="152" rx="22" fill="url(#glass)"/></g><rect x="24.5" y="24.5" width="215" height="151" rx="22" fill="none" stroke="url(#rim)"/><text x="46" y="58" class="m" font-size="10" fill="#78CFFF">ESTRELAS</text><text x="46" y="110" font-size="42" font-weight="800" letter-spacing="-1.5" fill="#F3F5FF">—</text><text x="46" y="142" font-size="12" fill="#B4B9D6">repos públicos</text><g filter="url(#sh)"><rect x="258" y="24" width="216" height="152" rx="22" fill="url(#glass)"/></g><rect x="258.5" y="24.5" width="215" height="151" rx="22" fill="none" stroke="url(#rim)"/><text x="280" y="58" class="m" font-size="10" fill="#78CFFF">COMMITS</text><text x="280" y="110" font-size="42" font-weight="800" letter-spacing="-1.5" fill="#F3F5FF">—</text><text x="280" y="142" font-size="12" fill="#B4B9D6">últimos 12 meses</text><g filter="url(#sh)"><rect x="492" y="24" width="216" height="152" rx="22" fill="url(#glass)"/></g><rect x="492.5" y="24.5" width="215" height="151" rx="22" fill="none" stroke="url(#rim)"/><text x="514" y="58" class="m" font-size="10" fill="#78CFFF">PULL REQUESTS</text><text x="514" y="110" font-size="42" font-weight="800" letter-spacing="-1.5" fill="#F3F5FF">—</text><text x="514" y="142" font-size="12" fill="#B4B9D6">últimos 12 meses</text><g filter="url(#sh)"><rect x="726" y="24" width="216" height="152" rx="22" fill="url(#glass)"/></g><rect x="726.5" y="24.5" width="215" height="151" rx="22" fill="none" stroke="url(#rim)"/><text x="748" y="58" class="m" font-size="10" fill="#78CFFF">ISSUES</text><text x="748" y="110" font-size="42" font-weight="800" letter-spacing="-1.5" fill="#F3F5FF">—</text><text x="748" y="142" font-size="12" fill="#B4B9D6">últimos 12 meses</text><g filter="url(#sh)"><rect x="960" y="24" width="216" height="152" rx="22" fill="url(#glass)"/></g><rect x="960.5" y="24.5" width="215" height="151" rx="22" fill="none" stroke="url(#rim)"/><text x="982" y="58" class="m" font-size="10" fill="#78CFFF">REPOSITÓRIOS</text><text x="982" y="110" font-size="42" font-weight="800" letter-spacing="-1.5" fill="#F3F5FF">—</text><text x="982" y="142" font-size="12" fill="#B4B9D6">contribuídos</text>
<text x="1176" y="192" text-anchor="end" font-size="10" fill="#7C83A6">atualizado em 2026-11-08 UTC</text></g>
<rect x=".5" y=".5" width="1199" height="199" rx="28" fill="none" stroke="url(#rim)"/>
</svg>