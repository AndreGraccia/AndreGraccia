<g><rect width="500" height="276" rx="16" fill="#0B0B0B" stroke="#29232F"/><text x="28" y="46" fill="#A78BFA" font-family="JetBrains Mono,Consolas,monospace" font-size="13">01 / FULL-STACK · EM EVOLUÇÃO</text><text x="28" y="101" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700">Wall.ia</text><text x="28" y="143" fill="#BDB4CA" font-family="Inter,Arial,sans-serif" font-size="17">Carteira digital com projeções financeiras</text><text x="28" y="169" fill="#BDB4CA" font-family="Inter,Arial,sans-serif" font-size="17">determinísticas e explicações assistidas por IA.</text><path d="M28 205H472" stroke="#302B38"/><text x="28" y="240" fill="#D1C9DD" font-family="JetBrains Mono,Consolas,monospace" font-size="13">JAVA / SPRING / REACT / POSTGRESQL</text><text x="28" y="262" fill="#8E879A" font-family="JetBrains Mono,Consolas,monospace" font-size="12">SANDBOX · NÃO MOVIMENTA DINHEIRO REAL</text></g>
