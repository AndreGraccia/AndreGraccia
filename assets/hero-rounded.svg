<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
<title id="title">André Graccia — Backend Software Engineer</title>
<desc id="desc">Banner editorial em liquid glass, com escultura translúcida iridescente em violeta e azul sobre fundo escuro.</desc>
<defs>
