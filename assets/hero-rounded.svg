<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="470" viewBox="0 0 1600 470" role="img" aria-labelledby="title desc">
<title id="title">André Graccia — Desenvolvedor Back-end Java</title>
<desc id="desc">Banner escuro de portfólio com escultura fluida de vidro líquido iridescente em azul, ciano e violeta.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#05060B"/><stop offset=".52" stop-color="#090B16"/><stop offset="1" stop-color="#05050A"/>
  </linearGradient>
  <radialGradient id="glowBlue" cx="72%" cy="46%" r="48%">
    <stop stop-color="#315DFF" stop-opacity=".24"/><stop offset=".55" stop-color="#2638A8" stop-opacity=".10"/><stop offset="1" stop-color="#080912" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowViolet" cx="84%" cy="65%" r="36%">
    <stop stop-color="#9B54FF" stop-opacity=".22"/><stop offset="1" stop-color="#9B54FF" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="glassBody" x1=".08" y1=".08" x2=".92" y2=".92">
    <stop stop-color="#F5F7FF" stop-opacity=".88"/>
    <stop offset=".13" stop-color="#9BC7FF" stop-opacity=".66"/>
    <stop offset=".32" stop-color="#596CFF" stop-opacity=".48"/>
    <stop offset=".53" stop-color="#B18BFF" stop-opacity=".62"/>
    <stop offset=".72" stop-color="#69D8FF" stop-opacity=".48"/>
    <stop offset=".9" stop-color="#E6D9FF" stop-opacity=".72"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity=".9"/>
  </linearGradient>
  <linearGradient id="glassInner" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#FFFFFF" stop-opacity=".78"/><stop offset=".22" stop-color="#9CCBFF" stop-opacity=".24"/>
    <stop offset=".55" stop-color="#755CFF" stop-opacity=".16"/><stop offset=".82" stop-color="#5DE0FF" stop-opacity=".34"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity=".68"/>
  </linearGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#FFFFFF" stop-opacity=".94"/><stop offset=".22" stop-color="#A9D7FF" stop-opacity=".58"/>
    <stop offset=".5" stop-color="#B9A2FF" stop-opacity=".72"/><stop offset=".78" stop-color="#76E7FF" stop-opacity=".48"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity=".86"/>
  </linearGradient>
  <linearGradient id="specular" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".45" stop-color="#FFFFFF" stop-opacity=".95"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <filter id="blur30" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
  <filter id="blur8" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="warp" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency=".012 .018" numOctaves="2" seed="8" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <pattern id="microgrid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M48 0H0V48" fill="none" stroke="#A8B7FF" stroke-opacity=".045" stroke-width="1"/>
  </pattern>
  <clipPath id="clip"><rect width="1600" height="470" rx="26"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="1600" height="470" fill="url(#background)"/>
  <rect width="1600" height="470" fill="url(#microgrid)"/>
  <rect width="1600" height="470" fill="url(#glowBlue)"/>
  <rect width="1600" height="470" fill="url(#glowViolet)"/>
  <path d="M0 390C280 340 440 438 700 388S1160 318 1600 365" fill="none" stroke="#8E9CFF" stroke-opacity=".07"/>
  <ellipse cx="1270" cy="236" rx="270" ry="180" fill="#466CFF" opacity=".18" filter="url(#blur30)"/>
  <ellipse cx="1320" cy="280" rx="210" ry="130" fill="#A34EFF" opacity=".16" filter="url(#blur30)"/>
  <!-- Liquid-glass sculpture: folded, hollow ribbon with refractive inner surface -->
  <g transform="translate(1005 12) rotate(-12 285 220)" filter="url(#warp)">
    <path d="M180 72C250 15 369 24 426 94C474 153 449 210 505 238C557 265 622 234 661 283C707 340 657 416 582 428C501 441 454 388 393 405C325 424 300 476 226 452C153 428 128 356 163 296C194 242 246 222 238 174C231 131 151 120 180 72Z"
      fill="url(#glassBody)" fill-opacity=".30" stroke="url(#rim)" stroke-width="3"/>
    <path d="M220 95C276 54 359 57 399 111C434 157 406 204 455 241C492 270 562 251 590 292C622 339 578 385 526 386C466 388 427 343 375 358C317 375 287 429 235 407C185 387 174 337 204 292C232 251 286 222 277 174C270 137 190 127 220 95Z"
      fill="url(#glassInner)" fill-opacity=".62" stroke="#FFFFFF" stroke-opacity=".34" stroke-width="1.6"/>
    <path d="M191 87C248 32 357 35 414 96C456 141 430 195 483 233C527 264 600 244 638 285"
      fill="none" stroke="#FFFFFF" stroke-opacity=".78" stroke-width="5" stroke-linecap="round"/>
    <path d="M207 107C249 67 327 61 376 92" fill="none" stroke="url(#specular)" stroke-width="14" stroke-linecap="round" opacity=".8" filter="url(#blur8)"/>
    <path d="M215 113C260 73 326 70 373 98" fill="none" stroke="#FFFFFF" stroke-opacity=".84" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M222 352C263 393 316 386 360 354C404 323 445 320 478 337" fill="none" stroke="#C8F1FF" stroke-opacity=".65" stroke-width="2"/>
    <path d="M300 120C339 103 384 117 400 153C417 190 394 218 423 249" fill="none" stroke="#FFFFFF" stroke-opacity=".38" stroke-width="1.6"/>
    <path d="M477 272C514 286 551 278 570 302" fill="none" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="330" cy="91" rx="75" ry="19" fill="#FFFFFF" opacity=".14" filter="url(#blur8)" transform="rotate(17 330 91)"/>
    <ellipse cx="510" cy="375" rx="90" ry="16" fill="#71DFFF" opacity=".13" filter="url(#blur8)" transform="rotate(-15 510 375)"/>
  </g>
  <!-- Floating optical glints -->
  <circle cx="1452" cy="98" r="2" fill="#D8E6FF" opacity=".8"/>
  <circle cx="1490" cy="140" r="1.5" fill="#B7A6FF" opacity=".8"/>
  <circle cx="1120" cy="390" r="2" fill="#9BDFFF" opacity=".7"/>
  <path d="M1445 78h26M1458 65v26" stroke="#D9E7FF" stroke-opacity=".42"/>
  <path d="M80 70H1520" stroke="#D8DEFF" stroke-opacity=".16"/>
  <text x="96" y="52" fill="#B9C4E8" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="3.4">PORTFOLIO  /  SOFTWARE ENGINEERING</text>
  <text x="92" y="201" fill="#FFFFFF" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="88" font-weight="760" letter-spacing="-4.8">André Graccia</text>
  <rect x="764" y="137" width="9" height="68" rx="2" fill="#F7FAFF" opacity=".96"/>
  <text x="98" y="259" fill="#D7DDF0" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="27" font-weight="450" letter-spacing=".1">Desenvolvedor Back-end Java</text>
  <text x="100" y="308" fill="#929CB9" font-family="SFMono-Regular,Consolas,monospace" font-size="15" letter-spacing=".7">$ design  /  build  /  verify  /  improve</text>
  <path d="M96 378H1504" stroke="#C8D0F8" stroke-opacity=".22"/>
  <g fill="#C7CEE6" font-family="SFMono-Regular,Consolas,monospace" font-size="12" letter-spacing="1.5">
    <text x="98" y="414">JAVA 25</text><text x="245" y="414">SPRING BOOT</text><text x="454" y="414">REST APIs</text><text x="610" y="414">MAVEN</text><text x="738" y="414">SOFTWARE QUALITY</text>
  </g>
  <text x="1502" y="414" text-anchor="end" fill="#AFA0FF" font-family="SFMono-Regular,Consolas,monospace" font-size="12" letter-spacing="1.4">BR  /  2026</text>
  <path d="M96 442H1504" stroke="#A9B6F4" stroke-opacity=".08"/>
</g>
</svg>