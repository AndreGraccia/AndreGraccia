<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
<title id="title">André Graccia — Back-end Java / Orbital Systems</title>
<desc id="desc">Portfolio banner with a glass astronaut, the GitHub Octocat emblem centered in the helmet, and a violet-cyan orbital environment.</desc>
<defs>
 <linearGradient id="space" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070A13"/><stop offset=".55" stop-color="#10152A"/><stop offset="1" stop-color="#17152D"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".25"/><stop offset=".38" stop-color="#78CFFF" stop-opacity=".08"/><stop offset="1" stop-color="#8C78FF" stop-opacity=".22"/></linearGradient>
 <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".9"/><stop offset=".42" stop-color="#78CFFF" stop-opacity=".8"/><stop offset="1" stop-color="#8C78FF" stop-opacity=".9"/></linearGradient>
 <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8C78FF"/><stop offset="1" stop-color="#78CFFF"/></linearGradient>
 <radialGradient id="nebula"><stop stop-color="#8C78FF" stop-opacity=".32"/><stop offset="1" stop-color="#8C78FF" stop-opacity="0"/></radialGradient>
 <radialGradient id="blueNebula"><stop stop-color="#78CFFF" stop-opacity=".22"/><stop offset="1" stop-color="#78CFFF" stop-opacity="0"/></radialGradient>
 <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="18"/></filter>
 <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
 <pattern id="stars" width="118" height="94" patternUnits="userSpaceOnUse"><circle cx="12" cy="19" r="1" fill="#DDE7FF" opacity=".55"/><circle cx="72" cy="57" r=".8" fill="#78CFFF" opacity=".7"/><circle cx="101" cy="12" r=".7" fill="#FFFFFF" opacity=".5"/></pattern>
 <clipPath id="visor"><ellipse cx="1245" cy="218" rx="91" ry="83"/></clipPath>
</defs>
<rect width="1600" height="500" fill="url(#space)"/>
<rect width="1600" height="500" fill="url(#stars)" opacity=".8"/>
<ellipse cx="1260" cy="245" rx="390" ry="300" fill="url(#nebula)"/>
<ellipse cx="1080" cy="390" rx="270" ry="190" fill="url(#blueNebula)"/>
<path d="M0 422C290 365 515 475 770 417S1260 350 1600 411" fill="none" stroke="#78CFFF" stroke-opacity=".12"/>
<path d="M0 440C320 385 510 493 810 435S1270 370 1600 432" fill="none" stroke="#8C78FF" stroke-opacity=".12"/>
<path d="M88 72H1512" stroke="#FFFFFF" stroke-opacity=".15"/>
<text x="96" y="51" fill="#AEB9D3" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="3">PORTFOLIO / SOFTWARE ENGINEERING</text>
<text x="90" y="218" fill="#FFFFFF" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="76" font-weight="700" letter-spacing="-3.5">André Graccia</text>
<rect x="94" y="247" width="66" height="3" rx="1.5" fill="url(#violet)"><animate attributeName="width" values="66;94;66" dur="5s" repeatCount="indefinite"/></rect>
<text x="94" y="294" fill="#E0E6F4" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="25">Desenvolvedor Back-end Java</text>
<text x="96" y="340" fill="#9AA7C4" font-family="SFMono-Regular,Consolas,monospace" font-size="13" letter-spacing=".6">Designing reliable software, one step at a time.</text>
<g transform="translate(94 382)">
 <rect width="570" height="48" rx="13" fill="#FFFFFF" fill-opacity=".045" stroke="#D9E3FF" stroke-opacity=".22"/>
 <path d="M1 13Q1 1 13 1H557" fill="none" stroke="#FFFFFF" stroke-opacity=".22"/>
 <g fill="#E1E8F8" font-family="SFMono-Regular,Consolas,monospace" font-size="11" letter-spacing="1.2"><text x="20" y="30">JAVA 25</text><text x="137" y="30">SPRING BOOT</text><text x="292" y="30">REST APIs</text><text x="414" y="30">MAVEN</text></g>
 <g fill="url(#violet)"><circle cx="119" cy="24" r="2.2"/><circle cx="274" cy="24" r="2.2"/><circle cx="396" cy="24" r="2.2"/></g>
</g>
<!-- Orbital glass HUD -->
<g transform="translate(1000 35)">
 <rect x="0" y="0" width="500" height="420" rx="42" fill="url(#glass)" stroke="url(#rim)" stroke-opacity=".38"/>
 <rect x="1" y="1" width="498" height="418" rx="41" fill="none" stroke="#FFFFFF" stroke-opacity=".12"/>
 <path d="M26 34H474" stroke="#FFFFFF" stroke-opacity=".15"/>
 <path d="M26 386H474" stroke="#FFFFFF" stroke-opacity=".12"/>
 <text x="30" y="24" fill="#AFC0DF" font-family="monospace" font-size="9" letter-spacing="1.8">ORBITAL / NODE 01</text>
 <text x="470" y="24" text-anchor="end" fill="#AFC0DF" font-family="monospace" font-size="9" letter-spacing="1.5">SYSTEM ONLINE</text>
</g>
<!-- Astronaut silhouette and backpack -->
<g id="astronaut">
 <animateTransform attributeName="transform" type="translate" values="0 4;0 -5;0 4" dur="6s" repeatCount="indefinite"/>
