<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
<title id="title">André Graccia — Desenvolvedor Back-end Java</title>
<desc id="desc">Banner escuro com identidade azul e violeta, tipografia editorial, elementos de vidro e animações sutis de luz e órbitas.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090B13"/><stop offset=".58" stop-color="#0D1020"/><stop offset="1" stop-color="#111329"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8C78FF"/><stop offset="1" stop-color="#78CFFF"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".20"/><stop offset=".45" stop-color="#78CFFF" stop-opacity=".055"/><stop offset="1" stop-color="#8C78FF" stop-opacity=".20"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".68"/><stop offset=".48" stop-color="#78CFFF" stop-opacity=".55"/><stop offset="1" stop-color="#8C78FF" stop-opacity=".72"/></linearGradient>
  <radialGradient id="violetGlow"><stop stop-color="#8C78FF" stop-opacity=".25"/><stop offset="1" stop-color="#8C78FF" stop-opacity="0"/></radialGradient>
  <radialGradient id="blueGlow"><stop stop-color="#78CFFF" stop-opacity=".2"/><stop offset="1" stop-color="#78CFFF" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#AAB7E8" stroke-opacity=".055" stroke-width="1"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
  <clipPath id="panel"><rect x="1040" y="70" width="430" height="360" rx="34"/></clipPath>
</defs>
<rect width="1600" height="500" fill="url(#bg)"/>
<rect width="1600" height="500" fill="url(#grid)" opacity=".65"/>
<ellipse cx="1280" cy="245" rx="360" ry="300" fill="url(#violetGlow)"/>
<ellipse cx="1110" cy="390" rx="250" ry="180" fill="url(#blueGlow)"/>
<path d="M0 420C310 350 480 500 790 410S1260 330 1600 400" fill="none" stroke="url(#accent)" stroke-opacity=".10" stroke-width="1"/>
<path d="M0 438C330 370 510 510 820 430S1280 360 1600 425" fill="none" stroke="#FFFFFF" stroke-opacity=".055"/>
<g opacity=".6">
  <circle cx="900" cy="118" r="2" fill="#78CFFF"><animate attributeName="opacity" values=".2;1;.2" dur="3.8s" repeatCount="indefinite"/></circle>
  <circle cx="965" cy="370" r="1.8" fill="#8C78FF"><animate attributeName="opacity" values="1;.25;1" dur="4.6s" repeatCount="indefinite"/></circle>
  <circle cx="1510" cy="120" r="2" fill="#78CFFF"><animate attributeName="opacity" values=".15;.9;.15" dur="3.2s" repeatCount="indefinite"/></circle>
</g>
<path d="M88 72H1512" stroke="#FFFFFF" stroke-opacity=".14"/>
<text x="96" y="52" fill="#A8B1CB" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="3">PORTFOLIO / SOFTWARE ENGINEERING</text>
<text x="90" y="218" fill="#FFFFFF" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="76" font-weight="700" letter-spacing="-3.5">André Graccia</text>
<rect x="94" y="247" width="48" height="3" rx="1.5" fill="url(#accent)"><animate attributeName="width" values="48;76;48" dur="5s" repeatCount="indefinite"/></rect>
<text x="94" y="294" fill="#D3D9E9" font-family="Inter,Helvetica Neue,Arial,sans-serif" font-size="25">Desenvolvedor Back-end Java</text>
<text x="96" y="340" fill="#8994B0" font-family="SFMono-Regular,Consolas,monospace" font-size="13" letter-spacing=".7">Designing reliable software, one step at a time.</text>
<g transform="translate(94 382)">
  <rect width="570" height="48" rx="12" fill="#FFFFFF" fill-opacity=".035" stroke="#C8D3F0" stroke-opacity=".19"/>
  <rect x=".5" y=".5" width="569" height="47" rx="11.5" fill="none" stroke="url(#accent)" stroke-opacity=".13"/>
  <g fill="#DCE3F5" font-family="SFMono-Regular,Consolas,monospace" font-size="11" letter-spacing="1.2"><text x="20" y="30">JAVA 25</text><text x="129" y="30">SPRING BOOT</text><text x="283" y="30">REST APIs</text><text x="408" y="30">MAVEN</text></g>
  <g fill="url(#accent)"><circle cx="111" cy="24" r="2.2"/><circle cx="265" cy="24" r="2.2"/><circle cx="390" cy="24" r="2.2"/></g>
</g>
<!-- Glass architecture -->
<g clip-path="url(#panel)">
  <rect x="1040" y="70" width="430" height="360" rx="34" fill="#FFFFFF" fill-opacity=".018"/>
  <ellipse cx="1280" cy="250" rx="210" ry="170" fill="url(#violetGlow)" filter="url(#blur)"/>
  <ellipse cx="1370" cy="330" rx="150" ry="130" fill="url(#blueGlow)" filter="url(#blur)"/>
  <g fill="none" stroke-linecap="round">
    <ellipse cx="1260" cy="250" rx="176" ry="70" stroke="#78CFFF" stroke-opacity=".28" stroke-width="1.2" transform="rotate(-28 1260 250)"/>
    <ellipse cx="1260" cy="250" rx="176" ry="70" stroke="#8C78FF" stroke-opacity=".22" stroke-width="1.2" transform="rotate(38 1260 250)"/>
    <ellipse cx="1260" cy="250" rx="138" ry="54" stroke="#FFFFFF" stroke-opacity=".12" stroke-dasharray="2 9" transform="rotate(90 1260 250)"/>
  </g>
  <g transform="translate(1260 250)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="38s" repeatCount="indefinite"/>
      <circle cx="176" cy="0" r="4" fill="#78CFFF"><animate attributeName="r" values="3;5;3" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="-176" cy="0" r="3" fill="#8C78FF"/>
    </g>
  </g>
  <g>
    <rect x="1150" y="143" width="220" height="220" rx="42" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.5"/>
    <rect x="1160" y="153" width="200" height="200" rx="34" fill="none" stroke="#FFFFFF" stroke-opacity=".13"/>
    <path d="M1170 175Q1260 135 1350 175" fill="none" stroke="#FFFFFF" stroke-opacity=".38" stroke-width="2" stroke-linecap="round"/>
    <path d="M1170 330Q1260 370 1350 330" fill="none" stroke="url(#accent)" stroke-opacity=".5" stroke-width="2" stroke-linecap="round"/>
    <circle cx="1260" cy="253" r="65" fill="#090B13" fill-opacity=".28" stroke="#FFFFFF" stroke-opacity=".22"/>
    <circle cx="1260" cy="253" r="51" fill="url(#glass)" stroke="url(#accent)" stroke-opacity=".65"/>
    <path d="M1235 253L1252 270L1288 232" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1260" cy="253" r="78" fill="none" stroke="#78CFFF" stroke-opacity=".2" stroke-width="1"><animate attributeName="r" values="76;88;76" dur="5s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".2;.04;.2" dur="5s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#FFFFFF" fill-opacity=".16">
    <rect x="1080" y="110" width="74" height="8" rx="4"/><rect x="1080" y="126" width="42" height="5" rx="2.5"/>
    <rect x="1374" y="380" width="54" height="6" rx="3"/>
  </g>
  <path d="M1080 405L1430 105" stroke="#FFFFFF" stroke-opacity=".055" stroke-width="1"/>
</g>
<rect x="1040" y="70" width="430" height="360" rx="34" fill="none" stroke="url(#edge)" stroke-opacity=".42"/>
<path d="M88 466H1512" stroke="#FFFFFF" stroke-opacity=".1"/>
<text x="1504" y="454" text-anchor="end" fill="#78839F" font-family="SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="1.6">JAVA / BACK-END / ENGINEERING</text>
<path d="M0 0H1600" stroke="url(#accent)" stroke-width="2" stroke-opacity=".65">
  <animate attributeName="stroke-opacity" values=".3;.85;.3" dur="6s" repeatCount="indefinite"/>
</path>
</svg>