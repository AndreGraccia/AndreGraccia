 <path d="M1360 238Q1402 231 1408 263L1401 330Q1397 349 1373 346L1345 333Z" fill="#687493" stroke="#DDE7FF" stroke-opacity=".65" stroke-width="2"/>
 <path d="M1370 252L1390 257L1387 322L1364 326Z" fill="#A7B7D8" opacity=".72"/>
 <path d="M1139 303Q1103 328 1106 370L1148 394L1194 350Z" fill="#8C96B3" stroke="#DDE7FF" stroke-opacity=".7" stroke-width="2"/>
 <path d="M1338 305Q1372 326 1372 369L1330 395L1293 350Z" fill="#8994B0" stroke="#DDE7FF" stroke-opacity=".7" stroke-width="2"/>
 <path d="M1153 327Q1245 292 1337 327L1360 405Q1246 446 1130 405Z" fill="url(#glass)" stroke="url(#rim)" stroke-width="3"/>
 <path d="M1160 343Q1245 315 1330 343" fill="none" stroke="#FFFFFF" stroke-opacity=".45" stroke-width="3"/>
 <rect x="1203" y="356" width="83" height="38" rx="12" fill="#11182C" stroke="#78CFFF" stroke-opacity=".65"/>
 <path d="M1217 375H1272" stroke="#8C78FF" stroke-width="2" stroke-linecap="round"/>
 <circle cx="1216" cy="375" r="3" fill="#78CFFF"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle>
 <!-- Helmet shell -->
 <ellipse cx="1245" cy="218" rx="113" ry="108" fill="#AAB8D7" fill-opacity=".18" stroke="url(#rim)" stroke-width="8"/>
 <ellipse cx="1245" cy="218" rx="101" ry="96" fill="#10182C" stroke="#FFFFFF" stroke-opacity=".32" stroke-width="2"/>
 <ellipse cx="1245" cy="218" rx="91" ry="83" fill="url(#glass)" stroke="#78CFFF" stroke-opacity=".55" stroke-width="1.5"/>
 <g clip-path="url(#visor)">
  <ellipse cx="1213" cy="183" rx="62" ry="28" fill="#FFFFFF" opacity=".11" transform="rotate(-28 1213 183)"/>
  <path d="M1165 258Q1235 215 1328 246" fill="none" stroke="#78CFFF" stroke-opacity=".16" stroke-width="20" filter="url(#glow)"/>
  <!-- Official GitHub Invertocat silhouette, optically centered and undistorted -->
  <g transform="translate(1202 176) scale(.88)">
   <path fill="#FFFFFF" fill-rule="evenodd" clip-rule="evenodd" d="M48.854 0C21.839 0 0 22 0 49.217c0 21.756 13.993 40.172 33.405 46.69 2.427.49 3.316-1.059 3.316-2.362 0-1.141-.08-5.052-.08-9.127-13.59 2.934-16.42-5.867-16.42-5.867-2.184-5.704-5.42-7.17-5.42-7.17-4.448-3.015.324-3.015.324-3.015 4.934.326 7.523 5.052 7.523 5.052 4.367 7.496 11.404 5.378 14.235 4.074.404-3.178 1.699-5.378 3.074-6.6-10.839-1.141-22.243-5.378-22.243-24.283 0-5.378 1.94-9.778 5.014-13.2-.485-1.222-2.184-6.275.486-13.038 0 0 4.125-1.304 13.426 5.052a46.97 46.97 0 0 1 12.214-1.63c4.125 0 8.33.571 12.213 1.63 9.302-6.356 13.427-5.052 13.427-5.052 2.67 6.763.97 11.816.485 13.038 3.155 3.422 5.015 7.822 5.015 13.2 0 18.905-11.404 23.06-22.324 24.283 1.78 1.548 3.316 4.481 3.316 9.126 0 6.6-.08 11.897-.08 13.526 0 1.304.89 2.853 3.316 2.364 19.412-6.52 33.405-24.935 33.405-46.691C97.707 22 75.788 0 48.854 0z"/>
  </g>
  <path d="M1170 164Q1205 135 1245 136" fill="none" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="4" stroke-linecap="round"/>
 </g>
 <ellipse cx="1245" cy="218" rx="113" ry="108" fill="none" stroke="#FFFFFF" stroke-opacity=".48" stroke-width="1.5"/>
 <path d="M1160 293Q1245 321 1330 293" fill="none" stroke="#78CFFF" stroke-opacity=".7" stroke-width="3"/>
 <circle cx="1164" cy="218" r="5" fill="#78CFFF" stroke="#FFFFFF" stroke-opacity=".7"><animate attributeName="opacity" values=".35;1;.35" dur="2.8s" repeatCount="indefinite"/></circle>
 <circle cx="1326" cy="218" r="5" fill="#8C78FF" stroke="#FFFFFF" stroke-opacity=".7"><animate attributeName="opacity" values="1;.35;1" dur="2.8s" repeatCount="indefinite"/></circle>
</g>
<!-- Orbit paths and moving satellite -->
<ellipse cx="1245" cy="250" rx="210" ry="75" transform="rotate(-22 1245 250)" fill="none" stroke="url(#violet)" stroke-opacity=".48" stroke-width="1.5" stroke-dasharray="3 8">
 <animate attributeName="stroke-dashoffset" values="0;-44" dur="9s" repeatCount="indefinite"/>
</ellipse>
<circle r="5" fill="#78CFFF"><animateMotion dur="11s" repeatCount="indefinite" path="M1035 328A210 75 -22 1 0 1455 172A210 75 -22 1 0 1035 328"/></circle>
<g fill="#DCE8FF"><circle cx="860" cy="126" r="1.5"><animate attributeName="opacity" values=".2;1;.2" dur="3.5s" repeatCount="indefinite"/></circle><circle cx="935" cy="386" r="2"><animate attributeName="opacity" values="1;.25;1" dur="4.1s" repeatCount="indefinite"/></circle><circle cx="1490" cy="112" r="1.6"><animate attributeName="opacity" values=".2;.9;.2" dur="3s" repeatCount="indefinite"/></circle></g>
<path d="M88 466H1512" stroke="#FFFFFF" stroke-opacity=".12"/>
<text x="1504" y="454" text-anchor="end" fill="#8490AE" font-family="SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="1.6">JAVA / BACK-END / ENGINEERING</text>
<path d="M0 0H1600" stroke="url(#violet)" stroke-width="2" stroke-opacity=".7"><animate attributeName="stroke-opacity" values=".25;.85;.25" dur="5s" repeatCount="indefinite"/></path>
