  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".105"/><stop offset=".48" stop-color="#A8B6FF" stop-opacity=".035"/><stop offset="1" stop-color="#78CFFF" stop-opacity=".075"/></linearGradient>
