<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-label="André Graccia, engenheiro de software backend em Java">
<defs>
<radialGradient id="glow" cx="50%" cy="0%" r="75%"><stop offset="0" stop-color="#2997ff" stop-opacity=".38"/><stop offset="1" stop-color="#2997ff" stop-opacity="0"/></radialGradient>
<radialGradient id="glow2" cx="88%" cy="30%" r="45%"><stop offset="0" stop-color="#0071e3" stop-opacity=".28"/><stop offset="1" stop-color="#0071e3" stop-opacity="0"/></radialGradient>
<linearGradient id="sur" x1="0" x2="1"><stop offset="0" stop-color="#8ec9ff"/><stop offset=".55" stop-color="#2997ff"/><stop offset="1" stop-color="#7aa7ff"/></linearGradient>
<linearGradient id="ul" x1="0" x2="1"><stop offset="0" stop-color="#2997ff"/><stop offset="1" stop-color="#2997ff" stop-opacity="0"/></linearGradient>
</defs>
<clipPath id="reveal"><rect x="0" y="0" width="0" height="320"><animate attributeName="width" from="0" to="1000" begin="0.4s" dur="2.4s" fill="freeze"/></rect></clipPath>
<rect width="1000" height="320" rx="22" fill="#0b0b0d"/>
<rect width="1000" height="320" rx="22" fill="url(#glow)"/><rect width="1000" height="320" rx="22" fill="url(#glow2)"/>
<rect x=".5" y=".5" width="999" height="319" rx="21.5" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0s" dur="0.8s" fill="freeze"/>
<rect x="338" y="36" width="324" height="34" rx="17" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".16"/>
<text x="500" y="58" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace" font-size="14" fill="#f5f5f7">Java · Python · Spring Boot</text></g>
<g clip-path="url(#reveal)">
<text x="500" y="168" text-anchor="middle" font-size="92" letter-spacing="-3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="500" fill="#f5f5f7">André <tspan font-family="'Instrument Serif',Georgia,'Times New Roman',serif" font-style="italic" font-weight="400" font-size="108" letter-spacing="-1" fill="url(#sur)">Graccia</tspan></text>
</g>
<path d="M300 190H700" stroke="url(#ul)" stroke-width="2.5" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" from="1" to="0" begin="2.8s" dur="1.4s" fill="freeze"/></path>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.2s" dur="1s" fill="freeze"/>
<text x="500" y="250" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="500" fill="#f5f5f7">Engenheiro de software backend em <tspan fill="#2997ff">Java</tspan></text>
<text x="500" y="286" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#a1a1a6">APIs em Java e Spring Boot · automação de testes em Python · agentes de IA</text></g>
</svg>
