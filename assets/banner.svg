<svg width="1600" height="500" viewBox="0 0 1600 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">André Graccia — Desenvolvedor Back-end Java</title>
  <desc id="desc">Banner escuro com transição no nome, cursor piscando e brilho violeta.</desc>
  <defs>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="translate(800 505) rotate(-90) scale(260 920)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6D28D9" stop-opacity=".92"/>
      <stop offset=".58" stop-color="#3B0764" stop-opacity=".52"/>
      <stop offset="1" stop-color="#0B0615" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="400" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset=".5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <clipPath id="reveal">
      <rect x="350" y="100" width="0" height="125">
        <animate attributeName="width" values="0;900;900" keyTimes="0;.38;1" dur="5s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>
  <rect width="1600" height="500" fill="#0C031D"/>
  <ellipse cx="800" cy="510" rx="810" ry="178" fill="#5B21B6" fill-opacity=".48" filter="url(#blur)"/>
  <rect width="1600" height="500" fill="url(#aura)"/>
  <path d="M0 390C258 330 522 415 800 370C1114 319 1360 395 1600 342V500H0V390Z" fill="#08010F" fill-opacity=".4"/>
  <rect x="560" y="316" width="480" height="2" fill="url(#line)">
    <animate attributeName="opacity" values=".2;1;.2" dur="2.5s" repeatCount="indefinite"/>
  </rect>
  <g clip-path="url(#reveal)">
    <text x="800" y="206" text-anchor="middle" fill="#FCFCFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="94" font-weight="750" letter-spacing="-4">andré graccia</text>
  </g>
  <rect x="1260" y="127" width="14" height="83" fill="#A78BFA">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.42;.43;.78;.79" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <text x="800" y="281" text-anchor="middle" fill="#C4B5FD" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="27" font-weight="400" letter-spacing=".2">Desenvolvedor Back-end Java · Software que não pode falhar.</text>
  <text x="800" y="365" text-anchor="middle" fill="#A78BFA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">$ andre --backend --quality</text>
</svg>