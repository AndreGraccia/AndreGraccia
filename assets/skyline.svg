<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560" role="img" aria-labelledby="title desc">
<title id="title">André Graccia — Contribution Skyline</title>
<desc id="desc">Prévia da cidade isométrica em violeta e azul. O GitHub Actions substituirá esta prévia pelos dados reais de contribuições após a primeira execução.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090B13"/><stop offset="1" stop-color="#101326"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8C78FF"/><stop offset="1" stop-color="#78CFFF"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#8C78FF" stop-opacity=".18"/><stop offset="1" stop-color="#8C78FF" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#AAB7E8" stroke-opacity=".045"/></pattern>
</defs>
<rect width="1500" height="560" rx="24" fill="url(#bg)"/>
<rect width="1500" height="560" rx="24" fill="url(#grid)"/>
<ellipse cx="760" cy="290" rx="640" ry="250" fill="url(#glow)"/>
<text x="58" y="56" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="1.5">CONTRIBUTION SKYLINE</text>
