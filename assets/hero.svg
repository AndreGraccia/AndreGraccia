<clipPath id="c"><rect width="1200" height="320" rx="28"/></clipPath>
<g clip-path="url(#c)">
<rect width="1200" height="320" fill="#000"/>
<ellipse class="b1" cx="600" cy="352" rx="640" ry="190" fill="url(#glow)"/>
<ellipse class="b2" cx="600" cy="380" rx="360" ry="110" fill="#5119D4" opacity=".55" filter="url(#blur)"/>
