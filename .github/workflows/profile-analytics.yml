name: Atualizar gráficos do perfil

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-analytics.yml"
      - "scripts/generate_profile_svgs.py"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-readme
  cancel-in-progress: true

jobs:
  generate-svg:
    name: Gerar os dois gráficos SVG
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Gerar GitHub Stats e Top Languages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_profile_svgs.py

      - name: Publicar SVGs atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/top-languages.svg
          if git diff --cached --quiet; then
            echo "Os gráficos já estão atualizados."
            exit 0
          fi
          git commit -m "chore: atualiza gráficos SVG do perfil [skip ci]"
          git push
