name: Atualizar GitHub Skyline 3D

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-analytics.yml"
      - "README.md"
      - "scripts/render_skyline.py"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-skyline
  cancel-in-progress: false

jobs:
  generate-skyline:
    name: Gerar modelo 3D das contribuições
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Instalar extensão oficial GitHub Skyline
        run: gh extension install github/gh-skyline

      - name: Gerar skyline do ano atual
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          YEAR="$(date -u +%Y)"
          gh skyline --user AndreGraccia --year "$YEAR" --output assets/github-skyline.stl
      - name: Renderizar prévia PNG do modelo 3D
        run: |
          sudo apt-get update
          sudo apt-get install -y blender libegl1 libgl1 libgles2 xvfb
          xvfb-run -a blender --background --python scripts/render_skyline.py -- assets/github-skyline.stl assets/github-skyline.png

      - name: Gerar SVG incorporando a renderização do modelo 3D
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          png = base64.b64encode(Path("assets/github-skyline.png").read_bytes()).decode("ascii")
          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
          <title id="title">GitHub Skyline de André Graccia</title>
          <desc id="desc">Renderização do modelo STL oficial das contribuições GitHub, gerada automaticamente pelo GitHub Actions.</desc>
          <image width="1600" height="720" xlink:href="data:image/png;base64,{png}" />
          </svg>'''
          Path("assets/github-skyline.svg").write_text(svg, encoding="utf-8")
          PY

      - name: Publicar modelo 3D
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          # Keep the latest source changes and publish only generated Skyline assets.
          git reset --mixed origin/main
          git add assets/github-skyline.stl assets/github-skyline.png assets/github-skyline.svg
          if git diff --cached --quiet; then
            echo "A Skyline já está atualizada."
            exit 0
          fi
          git commit -m "chore: atualiza GitHub Skyline 3D [skip ci]"
          git push origin HEAD:main
