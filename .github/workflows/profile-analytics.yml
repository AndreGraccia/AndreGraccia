name: Atualizar GitHub Skyline 3D

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-analytics.yml"
      - "README.md"
      - "assets/github-skyline-preview.svg"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-skyline
  cancel-in-progress: false

jobs:
  generate-skyline:
    name: Gerar modelo 3D das contribuições
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Instalar extensão oficial GitHub Skyline
        run: gh extension install github/gh-skyline

      - name: Gerar skyline do ano atual
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          YEAR="$(date -u +%Y)"
          gh skyline --user AndreGraccia --year "$YEAR" --output assets/github-skyline.stl

      - name: Publicar modelo 3D
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-skyline.stl
          if git diff --cached --quiet; then
            echo "A Skyline já está atualizada."
            exit 0
          fi
          git commit -m "chore: atualiza GitHub Skyline 3D [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push recusado; sincronizando novamente (${attempt}/3)."
          done
          echo "Não foi possível publicar a Skyline após 3 tentativas."
          exit 1
