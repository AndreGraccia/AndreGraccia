name: Atualizar perfil do GitHub

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-readme
  cancel-in-progress: true

jobs:
  update-profile:
    name: Gerar gráficos e contribuições
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar métricas do perfil
        uses: lowlighter/metrics@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: AndreGraccia
          template: classic
          config_timezone: America/Sao_Paulo
          config_display: large
          config_output: assets/github-metrics.svg
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_colors: github
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      - name: Gerar gráfico de contribuições (snake)
        uses: Platane/snk@v3
        with:
          github_user_name: AndreGraccia
          outputs: |
            assets/github-contribution-snake.svg
            assets/github-contribution-snake-dark.svg?palette=github-dark

      - name: Salvar gráficos atualizados no repositório
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: atualiza métricas do perfil"
          file_pattern: assets/*.svg
