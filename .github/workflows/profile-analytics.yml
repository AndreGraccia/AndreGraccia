name: Atualizar gráfico de atividade do perfil

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-analytics.yml"
      - "scripts/generate_profile_svgs.py"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-readme
  cancel-in-progress: false

jobs:
  generate-svg:
    name: Gerar gráfico de atividade em SVG
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Gerar estatísticas públicas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_profile_svgs.py

      - name: Publicar SVG atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-activity.svg
          if git diff --cached --quiet; then
            echo "O gráfico já está atualizado."
            exit 0
          fi
          git commit -m "chore: atualiza gráfico de atividade SVG [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push recusado; tentando sincronizar novamente (${attempt}/3)."
          done
          echo "Não foi possível publicar o SVG após 3 tentativas."
          exit 1
