name: Profile contribution skyline

on:
  push:
    paths:
      - ".github/workflows/skyline.yml"
      - "scripts/generate-skyline.js"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate animated isometric contribution city
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: node scripts/generate-skyline.js

      - name: Commit updated skyline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/skyline.svg
          if git diff --cached --quiet; then
            echo "Skyline is already up to date."
          else
            git commit -m "chore: update contribution skyline"
            git push
          fi
