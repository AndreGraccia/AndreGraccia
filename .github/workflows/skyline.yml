name: Profile contribution skyline

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate custom isometric SVG from GitHub contributions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          async function main() {
            const end = new Date();
            const start = new Date(end);
            start.setUTCDate(start.getUTCDate() - 365);
            const query = `query($login: String!, $from: DateTime!, $to: DateTime!) {
              user(login: $login) {
                contributionsCollection(from: $from, to: $to) {
                  contributionCalendar {
                    totalContributions
                    weeks {
                      contributionDays { contributionCount date }
                    }
                  }
                }
              }
            }`;

            const response = await fetch("https://api.github.com/graphql", {
              method: "POST",
              headers: {
                "Authorization": `Bearer ${process.env.GH_TOKEN}`,
                "Content-Type": "application/json",
                "User-Agent": "AndreGraccia-profile-skyline"
              },
              body: JSON.stringify({
                query,
                variables: {
                  login: process.env.GH_LOGIN,
                  from: start.toISOString(),
                  to: end.toISOString()
                }
              })
            });
            const payload = await response.json();
            if (!response.ok || payload.errors || !payload.data?.user) {
              throw new Error(JSON.stringify(payload.errors || payload));
            }

            const calendar = payload.data.user.contributionsCollection.contributionCalendar;
            const weeks = calendar.weeks;
            const colors = ["#171A29", "#30284E", "#51418A", "#8C78FF", "#78CFFF"];
            const max = Math.max(1, ...weeks.flatMap(w => w.contributionDays.map(d => d.contributionCount)));
            const blocks = [];
            const cubeW = 8;
            const cubeD = 4;
            const stepX = 17;
            const stepY = 7;
            const dayX = 8;
            const dayY = 5;
            const originX = 190;
            const originY = 104;

            weeks.forEach((week, wi) => {
              week.contributionDays.forEach((day, di) => {
                const intensity = day.contributionCount === 0 ? 0 :
                  Math.min(4, Math.max(1, Math.ceil((day.contributionCount / max) * 4)));
                const h = day.contributionCount === 0 ? 2 : 4 + intensity * 7;
                const x = originX + wi * stepX + di * dayX;
                const y = originY + wi * stepY + di * dayY;
                const top = y - h;
                const c = colors[intensity];
                const front = intensity === 0 ? "#111522" : colors[Math.max(0, intensity - 1)];
                const side = intensity === 0 ? "#0D101A" : colors[Math.max(0, intensity - 2)];
                blocks.push(
                  `<g opacity="${intensity === 0 ? ".55" : ".98"}">` +
                  `<path d="M${x} ${top} l${cubeW} ${cubeD} v${h} l-${cubeW} -${cubeD}Z" fill="${front}"/>` +
                  `<path d="M${x} ${top} l-${cubeW} ${cubeD} v${h} l${cubeW} -${cubeD}Z" fill="${side}"/>` +
                  `<path d="M${x} ${top} l${cubeW} -${cubeD} l${cubeW} ${cubeD} l-${cubeW} ${cubeD} l-${cubeW} -${cubeD}Z" fill="${c}" stroke="#DDE7FF" stroke-opacity=".10" stroke-width=".5"/>` +
                  (intensity >= 3 ? `<path d="M${x-5} ${top+4} l8 -4" stroke="#FFFFFF" stroke-opacity=".35" stroke-width=".8"/>` : "") +
                  `<title>${day.date}: ${day.contributionCount} contributions</title></g>`
                );
              });
            });

            const width = 1500;
            const height = 560;
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img" aria-labelledby="title desc">
            <title id="title">André Graccia — GitHub Contribution Skyline</title>
            <desc id="desc">Isometric city built from the last 365 days of GitHub contributions. Violet and cyan blocks indicate contribution activity.</desc>
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090B13"/><stop offset="1" stop-color="#101326"/></linearGradient>
              <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8C78FF"/><stop offset="1" stop-color="#78CFFF"/></linearGradient>
              <radialGradient id="glow"><stop stop-color="#8C78FF" stop-opacity=".18"/><stop offset="1" stop-color="#8C78FF" stop-opacity="0"/></radialGradient>
              <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#AAB7E8" stroke-opacity=".045"/></pattern>
            </defs>
            <rect width="100%" height="100%" rx="24" fill="url(#bg)"/>
            <rect width="100%" height="100%" rx="24" fill="url(#grid)"/>
            <ellipse cx="760" cy="290" rx="640" ry="250" fill="url(#glow)"/>
            <text x="58" y="56" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="1.5">CONTRIBUTION SKYLINE</text>
            <text x="58" y="82" fill="#8994B0" font-family="monospace" font-size="11" letter-spacing="1.2">365 DAYS / ISOMETRIC ACTIVITY MAP</text>
            <path d="M58 98H1442" stroke="url(#line)" stroke-opacity=".38"/>
            <g>${blocks.join("")}</g>
            <path d="M58 488H1442" stroke="#FFFFFF" stroke-opacity=".10"/>
            <text x="58" y="520" fill="#A8B1CB" font-family="monospace" font-size="11">LESS</text>
            <g transform="translate(112 506)">${colors.map((c,i)=>`<rect x="${i*20}" y="0" width="14" height="10" rx="2" fill="${c}"/>`).join("")}</g>
            <text x="230" y="520" fill="#A8B1CB" font-family="monospace" font-size="11">MORE CONTRIBUTIONS</text>
            <text x="1442" y="520" text-anchor="end" fill="#78839F" font-family="monospace" font-size="10">${calendar.totalContributions} CONTRIBUTIONS</text>
            <path d="M58 540H1442" stroke="url(#line)" stroke-opacity=".25"/>
            </svg>`;
            fs.mkdirSync("assets", { recursive: true });
            fs.writeFileSync("assets/skyline.svg", svg);
          }

          main().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Commit updated skyline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/skyline.svg
          if git diff --cached --quiet; then
            echo "Skyline is already up to date."
          else
            git commit -m "chore: update contribution skyline"
            git push
          fi
