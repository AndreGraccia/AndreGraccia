name: Build profile visuals

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/profile-visuals.yml"
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate profile SVG assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          python3 scripts/generate_hero.py
          python3 scripts/generate_tech_stack.py
          python3 scripts/generate_projects.py
          python3 scripts/update_metrics.py

      - name: Validate SVG files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in sorted(Path("assets").glob("*.svg")):
              ET.parse(path)
              print(f"Valid SVG: {path}")
          PY

      - name: Commit generated assets
        run: |
          if git diff --quiet -- assets; then
            echo "No visual changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git commit -m "chore: refresh profile SVG assets"
          git push origin HEAD:main
